name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate repository contracts
        run: |
          python test/validate_maintenance.py
          python -m unittest discover -s test -p 'test_*.py' -v
      - name: Pack
        run: dotnet pack src/ThatRatDev.Steam.Boiler/ThatRatDev.Steam.Boiler.csproj -c Release -o artifacts -p:RepositoryCommit=${{ github.sha }}
      - name: Inspect package
        shell: bash
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("src/ThatRatDev.Steam.Boiler/ThatRatDev.Steam.Boiler.csproj").getroot()
          print(root.findtext(".//Version", "").strip())
          PY
          )
          python test/inspect_package.py "artifacts/ThatRatDev.Steam.Boiler.$version.nupkg" "$version" "${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: artifacts/*.nupkg
          retention-days: 7

  console-smoke:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: artifacts
      - name: Run console smoke test
        shell: bash
        run: |
          set -euo pipefail
          output=$(dotnet run --project test/Smoke/Smoke.csproj -c Release)
          echo "$output"
          grep -q "NATIVE-OK" <<< "$output"

  godot-smoke-and-export:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            preset: Linux x64
            export: BoilerGodotSmoke.x86_64
          - os: windows-latest
            target: windows
            preset: Windows x64
            export: BoilerGodotSmoke.exe
          - os: macos-latest
            target: macos
            preset: macOS Universal
            export: BoilerGodotSmoke.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: artifacts
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true
      - name: Verify Godot version
        shell: bash
        run: godot --version | grep -q '^4\.7\.2\.stable'
      - name: Build and run in Godot
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore test/GodotSmoke/Boiler.GodotSmoke.csproj
          dotnet build test/GodotSmoke/Boiler.GodotSmoke.csproj -c Debug --no-restore
          output=$(godot --headless --path test/GodotSmoke 2>&1)
          echo "$output"
          grep -q "Native resolver registered" <<< "$output"
          grep -q "GODOT-NATIVE-OK" <<< "$output"
      - name: Export and inspect ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/godot-export
          output_path="${{ github.workspace }}/artifacts/godot-export/${{ matrix.export }}"
          godot --headless --path test/GodotSmoke --export-release "${{ matrix.preset }}" "$output_path"
          python test/inspect_export.py "${{ matrix.target }}" artifacts/godot-export

  parity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check managed and native accessor parity
        shell: bash
        run: |
          set -euo pipefail
          base=src/ThatRatDev.Steam.Boiler/steam
          managed="$base/managed/Facepunch.Steamworks.Posix.dll"
          dylib="$base/native/osx/libsteam_api.dylib"

          strings "$managed" | grep -oE 'SteamAPI_I?Steam[A-Za-z]+_v[0-9]+' | sort -u > needs_all.txt
          # Valve omits ISteamAppList from client redistributables although Facepunch declares it.
          grep -vE 'SteamAPI_SteamAppList_v[0-9]+' needs_all.txt > needs.txt
          nm -gjU "$dylib" | sed 's/^_//' | grep -oE 'SteamAPI_I?Steam[A-Za-z]+_v[0-9]+' | sort -u > has.txt

          missing=$(comm -23 needs.txt has.txt || true)
          if [ -n "$missing" ]; then
            echo "::error::native is missing managed wrapper accessors:"
            echo "$missing"
            exit 1
          fi
          echo "Parity OK: $(wc -l < needs.txt | tr -d ' ') required accessors found."
